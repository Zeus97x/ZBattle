name: Android UI foundation checks

# Validation only: builds a debug APK, runs lint/tests and renders layout screenshots.
# Nothing is signed, released or published.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP installs any missing platform itself.
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests, debug APK and lint
        run: ./gradlew :core:test :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Integration contract fixtures and doc links (CLAUDE-004)
        run: |
          python3 -m pip install --quiet jsonschema==4.26.0
          python3 tools/validate_contract.py
          python3 tools/check_doc_links.py
      - name: Layout render harness (360dp / 412dp / 1.3x font / light mode)
        run: ./gradlew -p preview test --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zbattle-ui-validation
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            preview/build/screenshots/
            core/build/reports/tests/
            preview/build/reports/tests/
          if-no-files-found: warn
