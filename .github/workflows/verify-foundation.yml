name: Verify Android foundation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify profile rules
        run: |
          mkdir -p /tmp/zbattle-tests
          javac -d /tmp/zbattle-tests app/src/main/java/com/zeus97x/zbattle/MasterProfile.java tests/MasterProfileTest.java
          java -cp /tmp/zbattle-tests MasterProfileTest
      - name: Assemble and lint foundation
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ZBattle-debug-validation
          path: app/build/outputs/apk/debug/*.apk
